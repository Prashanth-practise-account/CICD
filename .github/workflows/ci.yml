name: CI PIPELINE

on:
  push:
    branches:
      - main

jobs:

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest


  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .


  deploy:
    needs:
      - unit-test
      - code-quality

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "${DOCKER_USERNAME}" ]; then
            echo "::error::DOCKER_USERNAME secret is not set. Add it in GitHub repository secrets."
            exit 1
          fi
          docker build -t "${DOCKER_USERNAME}/financial-risk-ai:latest" .

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "${DOCKER_USERNAME}" ]; then
            echo "::error::DOCKER_USERNAME secret is not set. Add it in GitHub repository secrets."
            exit 1
          fi
          docker push "${DOCKER_USERNAME}/financial-risk-ai:latest"


  deploy-staging:
    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest

      - name: Start Kubernetes
        run: |
          minikube start

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check pods
        run: |
          kubectl get pods

      - name: Check service
        run: |
          kubectl get services

      # QA TESTS START HERE

      - name: Setup Python for QA
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Get Minikube IP
        run: |
          echo "MINIKUBE_IP=$(minikube ip)" >> $GITHUB_ENV

      - name: Run API Tests
        env:
          STAGING_URL: http://${{ env.MINIKUBE_IP }}:30000
        run: |
          pytest qa/test_api.py

      - name: Run Integration Tests
        env:
          STAGING_URL: http://${{ env.MINIKUBE_IP }}:30000
        run: |
          pytest qa/test_integration.py

      - name: Run E2E Tests
        env:
          STAGING_URL: http://${{ env.MINIKUBE_IP }}:30000
        run: |
          pytest qa/test_e2e.py

      - name: Run Smoke Tests
        env:
          STAGING_URL: http://${{ env.MINIKUBE_IP }}:30000
        run: |
          pytest qa/test_smoke.py